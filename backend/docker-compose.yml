services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: motion-ai-app
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - motion-ai

  nginx:
    image: nginx:1.25-alpine
    container_name: motion-ai-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - motion-ai

  mysql:
    image: mysql:8.0
    container_name: motion-ai-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: motion_ai
      MYSQL_USER: motion_ai
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - motion-ai

  adminer:
    image: adminer:latest
    container_name: motion-ai-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    networks:
      - motion-ai

volumes:
  mysql-data:

networks:
  motion-ai:
    driver: bridge
